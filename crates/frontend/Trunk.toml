[build]
target = "index.html"
dist   = "dist"

[watch]
# Paths are relative to THIS file (crates/frontend/), not workspace root.
# Avoid pointing to "../target" which causes the canonical-path error.
ignore = ["dist", "target", "src/lib.rs"]

[serve]
# Use `addresses` (plural) — `address` is deprecated in trunk ≥0.20
addresses = ["127.0.0.1"]
port      = 3000
open      = false