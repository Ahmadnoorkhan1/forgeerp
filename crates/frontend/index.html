<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8"/>
  <meta name="viewport" content="width=device-width, initial-scale=1.0"/>
  <title>ForgeERP — Enterprise Resource Planning</title>
  <link rel="preconnect" href="https://fonts.googleapis.com"/>
  <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin/>
  <link
    href="https://fonts.googleapis.com/css2?family=Inter:wght@300;400;500;600;700&family=Roboto+Mono:wght@400;500&display=swap"
    rel="stylesheet"
  />
  <link
    href="https://fonts.googleapis.com/css2?family=Material+Symbols+Outlined:opsz,wght,FILL,GRAD@20..48,100..700,0..1,-50..200&display=swap"
    rel="stylesheet"
  />
  <style>
    /* ── MD3 Design Tokens ─────────────────────────────────────────── */
    :root {
      /* Primary */
      --md-primary:         #B8C9FF;
      --md-on-primary:      #1A2B5C;
      --md-primary-ctr:     #324478;
      --md-on-primary-ctr:  #D8E2FF;
      /* Secondary */
      --md-secondary:       #C3C6D6;
      --md-on-secondary:    #2D303E;
      --md-secondary-ctr:   #434656;
      --md-on-secondary-ctr:#DFE1F0;
      /* Tertiary */
      --md-tertiary:        #E3BADA;
      --md-on-tertiary:     #432742;
      --md-tertiary-ctr:    #5B3D5A;
      /* Surface */
      --md-surface:         #121318;
      --md-surface-dim:     #121318;
      --md-surface-bright:  #38393F;
      --md-surface-ctr-low: #1A1B21;
      --md-surface-ctr:     #1F2027;
      --md-surface-ctr-hi:  #292A31;
      --md-surface-ctr-high:#34343B;
      --md-on-surface:      #E4E1E9;
      --md-on-surface-var:  #C7C5D0;
      --md-inverse-surface: #E4E1E9;
      --md-inverse-on-surface:#303036;
      /* Outline */
      --md-outline:         #918F9A;
      --md-outline-var:     #47464F;
      /* Error */
      --md-error:           #FFB4AB;
      --md-error-ctr:       #93000A;
      --md-on-error:        #690005;
      --md-on-error-ctr:    #FFDAD6;
      /* Success / Warning */
      --md-success:         #7BDB8E;
      --md-on-success:      #003915;
      --md-warning:         #F5D363;
      --md-on-warning:      #3E2E00;
      /* Shapes */
      --md-shape-xs:  4px;
      --md-shape-sm:  8px;
      --md-shape-md:  12px;
      --md-shape-lg:  16px;
      --md-shape-xl:  28px;
      --md-shape-full:9999px;
      /* Elevation */
      --md-elev-1: 0 1px 3px 1px rgba(0,0,0,.15), 0 1px 2px 0 rgba(0,0,0,.30);
      --md-elev-2: 0 2px 6px 2px rgba(0,0,0,.15), 0 1px 2px 0 rgba(0,0,0,.30);
      --md-elev-3: 0 4px 8px 3px rgba(0,0,0,.15), 0 1px 3px 0 rgba(0,0,0,.30);
      /* Typography */
      --md-font:      'Inter', system-ui, sans-serif;
      --md-font-mono: 'Roboto Mono', monospace;
      /* State layer opacities */
      --md-state-hover:   0.08;
      --md-state-focus:   0.12;
      --md-state-pressed: 0.12;
    }

    /* ── Reset ────────────────────────────────────────────────────── */
    *,*::before,*::after { box-sizing:border-box; margin:0; padding:0; }
    html,body {
      height:100%; background:var(--md-surface);
      color:var(--md-on-surface); font-family:var(--md-font);
      font-size:14px; line-height:1.5; -webkit-font-smoothing:antialiased;
      overflow-x:hidden;
    }
    a { text-decoration:none; color:inherit; }
    ::-webkit-scrollbar { width:8px; height:8px; }
    ::-webkit-scrollbar-track { background:var(--md-surface); }
    ::-webkit-scrollbar-thumb {
      background:var(--md-outline-var); border-radius:var(--md-shape-full);
    }
    ::-webkit-scrollbar-thumb:hover { background:var(--md-outline); }

    /* ── Background (scanlines/grid → clean surface) ─────────────── */
    .scanlines, .grid-bg { display:none; }

    /* ── Corner brackets → hidden ────────────────────────────────── */
    .bracket { display:none; }

    /* ── Pulse dot → MD3 status indicator ─────────────────────────── */
    .dot-pulse {
      flex-shrink:0; width:8px; height:8px;
      background:var(--md-success); border-radius:var(--md-shape-full);
      animation:pulse-md 2s ease-in-out infinite;
    }
    @keyframes pulse-md { 0%,100%{opacity:1} 50%{opacity:.4} }

    /* ── Auth page ────────────────────────────────────────────────── */
    .auth-page {
      min-height:100vh; display:flex; align-items:center; justify-content:center;
      position:relative;
      background:linear-gradient(160deg, var(--md-surface) 0%, #181A22 50%, #1A1D2B 100%);
    }
    .auth-wrap {
      position:relative; z-index:2; width:100%; max-width:420px; padding:20px;
    }
    .auth-card {
      position:relative;
      background:var(--md-surface-ctr);
      border:1px solid var(--md-outline-var);
      border-radius:var(--md-shape-xl);
      padding:40px 36px;
      box-shadow:var(--md-elev-3);
    }

    /* Logo */
    .auth-head { text-align:center; margin-bottom:28px; }
    .auth-logo {
      display:flex; align-items:center; justify-content:center;
      gap:10px; margin-bottom:8px;
    }
    .logo-icon {
      font-size:1.6rem; color:var(--md-primary);
      font-family:'Material Symbols Outlined';
    }
    .logo-text {
      font-family:var(--md-font); font-size:1.6rem; font-weight:700;
      color:var(--md-on-surface); letter-spacing:.02em;
    }
    /* disable glitch pseudo-elements */
    .logo-text::before, .logo-text::after { display:none; }

    .auth-tagline {
      font-size:.82rem; font-weight:400;
      color:var(--md-on-surface-var); letter-spacing:.01em;
      margin-bottom:12px;
    }
    .auth-status {
      display:inline-flex; align-items:center; gap:8px;
      font-size:.75rem; color:var(--md-on-surface-var);
      padding:6px 16px; border-radius:var(--md-shape-full);
      background:var(--md-surface-ctr-hi);
    }

    /* ── Form elements ────────────────────────────────────────────── */
    .auth-form { display:flex; flex-direction:column; gap:20px; margin-top:24px; }
    .field     { display:flex; flex-direction:column; gap:6px; }
    .field-lbl {
      font-size:.78rem; font-weight:500;
      color:var(--md-on-surface-var); letter-spacing:.02em;
    }
    .field-hint {
      font-size:.72rem; color:var(--md-on-surface-var);
      margin-top:4px; opacity:.7;
    }

    .field-inner {
      display:flex; align-items:center;
      border:1px solid var(--md-outline-var);
      border-radius:var(--md-shape-sm);
      background:var(--md-surface-ctr-low);
      transition:border-color .2s ease, box-shadow .2s ease;
    }
    .field-inner:focus-within {
      border-color:var(--md-primary);
      box-shadow:0 0 0 1px var(--md-primary);
    }
    .field-pfx {
      padding:0 8px 0 14px;
      color:var(--md-on-surface-var); font-size:.9rem;
      font-family:'Material Symbols Outlined';
      user-select:none;
    }
    .field-input {
      flex:1; background:transparent; border:none; outline:none;
      color:var(--md-on-surface); font-family:var(--md-font);
      font-size:.88rem; padding:13px 14px 13px 4px;
    }
    .field-input::placeholder { color:var(--md-outline); }

    /* ── Buttons ──────────────────────────────────────────────────── */
    .btn-primary, .btn-secondary, .btn-ghost,
    .btn-logout,  .btn-action {
      font-family:var(--md-font); font-weight:500; font-size:.84rem;
      letter-spacing:.02em; padding:12px 24px; cursor:pointer;
      border:none; border-radius:var(--md-shape-full);
      transition:all .2s ease; position:relative; overflow:hidden;
    }
    .btn-primary {
      background:var(--md-primary); color:var(--md-on-primary);
    }
    .btn-primary:hover:not(:disabled) {
      box-shadow:var(--md-elev-1);
      filter:brightness(1.08);
    }
    .btn-primary:active:not(:disabled) { filter:brightness(.95); }
    .btn-primary:disabled { opacity:.38; cursor:not-allowed; }

    .btn-secondary {
      background:transparent; color:var(--md-primary);
      border:1px solid var(--md-outline);
      border-radius:var(--md-shape-full);
    }
    .btn-secondary:hover {
      background:rgba(184,201,255,.08);
      border-color:var(--md-on-surface-var);
    }

    .btn-ghost {
      background:transparent; color:var(--md-primary);
      border:none; padding:8px 0; font-size:.8rem;
    }
    .btn-ghost:hover { text-decoration:underline; }

    .btn-logout {
      background:transparent; color:var(--md-error);
      border:1px solid rgba(255,180,171,.25);
      border-radius:var(--md-shape-full);
      padding:8px 18px; font-size:.78rem;
    }
    .btn-logout:hover {
      background:rgba(255,180,171,.08);
    }

    .btn-action {
      background:var(--md-primary-ctr); color:var(--md-on-primary-ctr);
      border:none; border-radius:var(--md-shape-full);
      padding:8px 18px; font-size:.78rem;
      display:inline-flex; align-items:center; gap:6px;
    }
    .btn-action:hover {
      box-shadow:var(--md-elev-1);
      filter:brightness(1.1);
    }

    /* ── Error bar ────────────────────────────────────────────────── */
    .err-bar {
      display:flex; align-items:center; gap:10px;
      padding:12px 16px;
      border-radius:var(--md-shape-sm);
      background:rgba(255,180,171,.08);
      border-left:3px solid var(--md-error);
      font-size:.82rem; color:var(--md-error);
    }
    .err-icon { color:var(--md-error); font-size:1.1rem; }

    /* ── Auth footer ──────────────────────────────────────────────── */
    .auth-foot {
      margin-top:28px; text-align:center;
      font-size:.82rem; color:var(--md-on-surface-var);
    }
    .link { color:var(--md-primary); font-weight:500; }
    .link:hover { text-decoration:underline; }

    /* ── App shell ────────────────────────────────────────────────── */
    .forge-app {
      min-height:100vh; position:relative;
      background:var(--md-surface);
    }

    /* ── Top nav ──────────────────────────────────────────────────── */
    .top-nav {
      position:sticky; top:0; z-index:100;
      display:flex; align-items:center; justify-content:space-between;
      flex-wrap:wrap; gap:8px; padding:12px 24px;
      background:var(--md-surface-ctr);
      border-bottom:1px solid var(--md-outline-var);
      box-shadow:var(--md-elev-1);
    }
    .nav-left, .nav-right { display:flex; align-items:center; gap:14px; }
    .nav-center           { display:flex; align-items:center; }

    .nav-logo-icon {
      color:var(--md-primary); font-size:1.2rem;
      font-family:'Material Symbols Outlined';
    }
    .nav-logo {
      font-family:var(--md-font); font-size:1rem; font-weight:700;
      color:var(--md-on-surface); letter-spacing:.02em;
    }
    .nav-module {
      font-size:.72rem; font-weight:500;
      color:var(--md-on-surface-var); letter-spacing:.04em;
      padding:4px 12px; border-radius:var(--md-shape-full);
      background:var(--md-surface-ctr-hi);
    }
    .nav-back {
      font-size:.82rem; color:var(--md-primary);
    }
    .nav-back:hover { text-decoration:underline; }
    .nav-tenant {
      display:flex; align-items:center; gap:8px;
      font-size:.82rem; color:var(--md-on-surface-var);
    }
    .tenant-icon { color:var(--md-primary); font-family:'Material Symbols Outlined'; }
    .nav-user {
      display:flex; align-items:center; gap:8px;
      font-size:.82rem; color:var(--md-on-surface-var);
    }
    .user-icon { color:var(--md-primary); font-family:'Material Symbols Outlined'; }
    .badge-online {
      font-size:.72rem; font-weight:500; color:var(--md-success);
      display:flex; align-items:center; gap:4px;
    }
    .badge-offline {
      font-size:.72rem; font-weight:500; color:var(--md-warning);
      display:flex; align-items:center; gap:4px;
    }

    /* ── Main content ─────────────────────────────────────────────── */
    .main-content {
      position:relative; z-index:2;
      max-width:1100px; margin:0 auto; padding:32px 24px;
    }
    .page-header {
      display:flex; align-items:flex-start; justify-content:space-between;
      flex-wrap:wrap; gap:16px; margin-bottom:24px;
    }
    .page-title {
      font-family:var(--md-font); font-size:1.5rem; font-weight:600;
      color:var(--md-on-surface); letter-spacing:-.01em;
    }
    .page-sub {
      font-size:.82rem; color:var(--md-on-surface-var);
      margin-top:4px;
    }

    /* ── Table panel ──────────────────────────────────────────────── */
    .table-panel {
      border:1px solid var(--md-outline-var);
      border-radius:var(--md-shape-md);
      background:var(--md-surface-ctr);
      box-shadow:var(--md-elev-1);
      overflow:hidden;
    }
    .panel-bar {
      display:flex; justify-content:space-between; align-items:center;
      padding:14px 20px;
      border-bottom:1px solid var(--md-outline-var);
      background:var(--md-surface-ctr-hi);
    }
    .panel-status {
      display:flex; align-items:center; gap:8px;
      font-size:.78rem; color:var(--md-on-surface-var);
    }
    .panel-id { font-size:.7rem; color:var(--md-outline); font-family:var(--md-font-mono); }
    .panel-actions { display:flex; align-items:center; gap:8px; }

    .table-scroll { overflow-x:auto; }
    .data-table   { width:100%; border-collapse:collapse; }
    .data-table thead tr {
      border-bottom:1px solid var(--md-outline-var);
    }
    .data-table th {
      padding:14px 20px; font-size:.75rem; font-weight:600;
      letter-spacing:.04em; color:var(--md-on-surface-var);
      text-align:left; white-space:nowrap;
      text-transform:uppercase;
    }
    .data-table td {
      padding:16px 20px;
      border-bottom:1px solid rgba(71,70,79,.4);
      vertical-align:middle; font-size:.88rem;
    }
    .data-row { transition:background .15s ease; }
    .data-row:hover { background:rgba(184,201,255,.04); }
    .data-row:last-child td { border-bottom:none; }
    .empty-cell {
      text-align:center; color:var(--md-on-surface-var);
      font-size:.88rem; padding:48px !important;
    }

    .mono-cell { font-family:var(--md-font-mono); font-size:.82rem; }
    .id-badge {
      font-family:var(--md-font-mono); font-size:.75rem;
      color:var(--md-primary);
      background:rgba(184,201,255,.08);
      border-radius:var(--md-shape-xs);
      padding:4px 10px;
    }
    .name-cell { font-weight:500; }
    .action-cell { display:flex; gap:8px; align-items:center; }

    /* Quantity badges */
    .qty-badge {
      font-family:var(--md-font-mono); font-size:.78rem; font-weight:500;
      padding:4px 14px; border-radius:var(--md-shape-full);
    }
    .qty-badge.ok  {
      color:var(--md-success); background:rgba(123,219,142,.1);
    }
    .qty-badge.low {
      color:var(--md-warning); background:rgba(245,211,99,.1);
    }
    .qty-badge.out {
      color:var(--md-error); background:rgba(255,180,171,.1);
    }

    /* ── Loading state ────────────────────────────────────────────── */
    .loading-state {
      display:flex; flex-direction:column; align-items:center;
      gap:16px; padding:60px;
      font-size:.88rem; color:var(--md-on-surface-var);
    }
    .spin-ring {
      width:40px; height:40px;
      border:3px solid var(--md-outline-var);
      border-top-color:var(--md-primary);
      border-radius:50%; animation:spin .8s linear infinite;
    }
    @keyframes spin { to { transform:rotate(360deg); } }

    /* ── Adjust form panel ────────────────────────────────────────── */
    .form-panel {
      position:relative; max-width:500px;
      background:var(--md-surface-ctr);
      border:1px solid var(--md-outline-var);
      border-radius:var(--md-shape-lg);
      padding:36px; box-shadow:var(--md-elev-2);
    }
    .adjust-form,
    .create-item-form { display:flex; flex-direction:column; gap:22px; }
    .form-actions {
      display:flex; gap:12px; justify-content:flex-end; margin-top:8px;
    }

    /* ── Responsive ───────────────────────────────────────────────── */
    @media (max-width:600px) {
      .auth-card    { padding:28px 20px; border-radius:var(--md-shape-lg); }
      .top-nav      { padding:10px 14px; }
      .main-content { padding:20px 14px; }
      .nav-center   { display:none; }
    }
  </style>
</head>
<body>
  <!-- Leptos WASM mounts here -->
</body>
</html>
